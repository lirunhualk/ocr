name: Deploy OCR to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - name: Fetch PaddleOCR models
        shell: bash
        run: |
          base=https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0
          mkdir -p static/models
          cd static/models
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            -O "$base/PP-OCRv6_tiny_det_onnx_infer.tar" \
            -O "$base/PP-OCRv6_tiny_rec_onnx_infer.tar"
          sha256sum --check <<'CHECKSUMS'
          ff6ab415b0a6e0c488550f2fb5d5046f1719848df220b2dc21b56402a65bc05d  PP-OCRv6_tiny_det_onnx_infer.tar
          1e13b22717b1edd89d4cde4fda272b6c17d5b505c97c2baea99da1a3a2d54b29  PP-OCRv6_tiny_rec_onnx_infer.tar
          CHECKSUMS
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
